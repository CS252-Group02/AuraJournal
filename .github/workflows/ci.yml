name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-cross-platform:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy: { matrix: { os: [ubuntu-latest, windows-latest, macos-latest] } }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aurajournal@localhost:5432/aurajournal_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
          user: aurajournal
          database: aurajournal_test
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: python -m pytest tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run build
