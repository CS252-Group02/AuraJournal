<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Critical canvas colors while the Vite stylesheet is loading. */
      :root { color-scheme: light; background: #f8f7f1; color: #283d36; }
      :root[data-theme="dark"] { color-scheme: dark; background: #1c2823; color: #f0eee4; }
    </style>
    <script>
      // Apply before styles/React paint. Keep validation aligned with theme/theme.js.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('aurajournal-theme') === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>AuraJournal PoC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
